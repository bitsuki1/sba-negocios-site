name: Deploy de produção (GitHub Pages)

# ⚠️ LEGADO — produção real = Vercel (deploy automático no push à main) desde ~07-2026.
# O gatilho de push foi REMOVIDO para não haver dois deploys concorrentes da main
# (Pages × Vercel); o Pages legado fica mantido só para disparo manual
# (workflow_dispatch) — decisão de 2026-08-13.
# Requisitos (uma vez), nas Settings do repo, caso o disparo manual seja usado:
#   - Actions > General > Workflow permissions = "Read and write"
#   - Pages > Build and deployment > Source = "GitHub Actions"

on:
  workflow_dispatch:

# Permissões mínimas para publicar no Pages via Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Piso de custo do portfolio (2026-09-07): sem teto, um job travado so para
    # no limite de 6h do GitHub — foi assim que 11 execucoes de um teste queimaram
    # ~66h de runner numa manha. 60 min = 1,7x a mais demorada que ja deu certo no
    # portfolio (36,2 min, medido em 253 execucoes). Precisa de mais? levante AQUI,
    # com o motivo na linha: reprovar aparece, travar seis horas nao.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build de produção (base "/", domínio próprio)
        run: npm run build
        # SEM BASE_PATH → base "/" (apex sbanegocios.com.br)

      - name: Domínio próprio + fallback de SPA
        run: |
          printf 'sbanegocios.com.br\n' > dist/CNAME
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Piso de custo do portfolio (2026-09-07): sem teto, um job travado so para
    # no limite de 6h do GitHub — foi assim que 11 execucoes de um teste queimaram
    # ~66h de runner numa manha. 60 min = 1,7x a mais demorada que ja deu certo no
    # portfolio (36,2 min, medido em 253 execucoes). Precisa de mais? levante AQUI,
    # com o motivo na linha: reprovar aparece, travar seis horas nao.
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
