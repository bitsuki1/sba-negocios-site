name: linter-estado
# dono: orquestrador do site da SBA (esta casa); quem responde é a instância aberta nela
# validade: 2027-05-09
# Verificação de estado do repositório, no servidor.
# O ponteiro para o kit central (kit v2.10.0 · passe do kit trazido pelo Escritório do MOU em 09/11/2026,
# por ordem do dono do mesmo dia). Antes daqui este robô rodava só o `linter-estado.sh` da casa; agora
# tem duas tarefas:
#   - `kit`: o portão do kit central, no SHA do `.kit` desta casa. Trava o que o envio ACRESCENTOU:
#     forma de segredo, leitura de segredo sem a linha de declaração, toque de produção sem a ordem
#     do dono, item de clique do dono sem link. O `.kit` diz `varredura: enforce`.
#   - `saude`: o linter desta casa, que AVISA e não trava (D247), e a regra da `main` medida pelo GitHub.
# Por que um relógio (`schedule`): envio feito por robô não dispara robô, então uma juntada feita por
# robô nunca seria medida (a "régua sem relógio" da S05 do kit). Uma vez por semana, na `main`.
# Trocar de versão do kit = trocar o SHA aqui E no `.kit`, juntos, num pedido só.
# ⚰️ até 09/11/2026: `push` em todo galho + `pull_request`, e só `bash linter-estado.sh` (que travava).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 10 * * 4'   # quinta-feira, ~07:41 em Brasília
  workflow_dispatch: {}
permissions:
  contents: read
# Piso de custo do portfólio (2026-09-07): este robô VERIFICA; cancelar a rodada anterior do mesmo
# galho não perde nada, porque o que importa é o estado ATUAL do código.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0`: sem a história, o portão não acha a base e sai 2 ("não mediu").
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: O portão do kit central, no SHA do .kit desta casa
        uses: bitsuki1/portfolio-kit/linter@9cafa16fc42eee5bb9864d616559160e6d34a644 # kit v2.10.0
        with:
          modo: portao
          base: ${{ github.ref == 'refs/heads/main' && github.event.before || '' }}
  saude:
    runs-on: ubuntu-24.04
    # Piso de custo do portfólio (2026-09-07): sem teto, um job travado só para no limite de 6 h do
    # GitHub. Reprovar aparece; travar seis horas, não.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Saúde da casa — o linter desta casa avisa e não trava (D247)
        run: |
          if bash linter-estado.sh; then
            echo "SAÚDE: 🟩"
          else
            echo "::warning title=saúde da casa::o linter desta casa acusou 🟥 — veja o log acima. Avisa, não trava (D247)."
          fi
      - name: A regra da `main` desta casa — medida pelo GitHub, não lembrada
        if: always()
        uses: bitsuki1/portfolio-kit/regras@9cafa16fc42eee5bb9864d616559160e6d34a644 # kit v2.10.0
        with:
          token: ${{ github.token }}
          exige: kit
