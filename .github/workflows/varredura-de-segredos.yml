name: varredura-de-segredos
#
# ════════════════════════════════════════════════════════════════════════════
# KIT — A PORTA DE ENTRADA DE SEGREDOS (o dente da D200) · versão UNIDADE/APP
# ════════════════════════════════════════════════════════════════════════════
# COMO SE INSTALA (dois arquivos, nada mais):
#   1. copie `varredura-de-segredos.mjs` (ao lado deste) para `scripts/varredura-de-segredos.mjs`;
#   2. copie ESTE arquivo para `.github/workflows/varredura-de-segredos.yml`.
#   Não precisa de dependência, package.json, nem instalação — é Node puro.
#   O script é CÓPIA BYTE-A-BYTE do que roda no escritório: a diferença entre
#   escritório e unidade mora só neste yml (no passo da árvore, lá embaixo).
#   Se um dia o `md5sum` dos dois .mjs divergir, alguém editou a cópia — é
#   drift, e o conserto é trazer o do escritório de volta.
#
# POR QUE EXISTE
#   Ordem viva do MOU, 21/08/2026 (D200, verbatim): "credencial em git não é
#   mais aceito, vamos arrumar a partir de agora e não deixarmos mais
#   acontecer". A decisão tem duas metades — este workflow é só a SEGUNDA:
#     · "arrumar o que já está lá"  → é ato do DONO (D208: o valor sai do HEAD
#        e vira PONTEIRO ao cofre humano; ROTAÇÃO NÃO É EXIGIDA; o histórico
#        FICA). Ninguém mais rotaciona, apaga chave ou reescreve histórico.
#     · "não deixar acontecer de novo" → É ISTO AQUI.
#   Precedente: bitsuki1/profinders-hub (verificacao.yml) e a Keepee.
#
#
# ⚠️ ESTA PORTA PODE MORRER CALADA — E O TESTE NÃO É LER ESTE ARQUIVO, É LER O HISTÓRICO
#   Medido em 14/09/2026, no `portfolio-automacoes`: **145 execuções deste workflow, 135
#   `startup_failure`**. Ele nunca rodou uma única vez na `main` daquela casa, desde que
#   o kit o instalou em 01/09 — treze dias com o dente da D200 inerte.
#
#   O QUE TORNA ISTO PERIGOSO NÃO É A FALHA, É O SILÊNCIO: `startup_failure` acontece
#   ANTES do job, então **não gera check no pull request**. O PR fica verde, o mapa fica
#   verde, e a porta da D200 está inerte. Foi assim que passou 13 dias — e a instância que
#   diagnosticou escreveu o conserto numa branch, mas ele nunca chegou à `main`, e a onda
#   seguinte do kit apagou o próprio aviso que ela tinha deixado no arquivo.
#
#   POR QUE MORREU, com a explicação CORRIGIDA no mesmo dia: naquela casa, ação com tag
#   (`@v4`) é recusada antes do job; fixada por SHA, roda (provado: execuções #146 e #147,
#   11 s). A 1ª versão desta nota dizia que a causa era *"a casa fixa tudo por SHA"* — isso
#   é correlação de UM caso, e o segundo caso a derruba: a `sba-unidades-de-negocios` fixa
#   61 ações por SHA, tem as MESMAS duas tags neste mesmo arquivo, e roda verde (423
#   execuções). Convenção não recusa nada; quem recusa é um ajuste do repositório. A ordem
#   real: a casa fixa por SHA PORQUE o repositório recusa tag — e ela já sabia disso desde
#   22/08 (commit `74c29e3`: *"fix: pin actions/checkout ao SHA … (startup_failure)"*),
#   noutro workflow. A onda do kit trouxe de volta um defeito que a casa já tinha curado.
#
#   AO INSTALAR — o teste que vale (o arquivo mente, o histórico não): abra as execuções
#   deste workflow na `main` da sua casa. Se TODAS derem `startup_failure`, é isto: fixe as
#   linhas `uses:` abaixo pelo SHA completo que a sua casa já confia
#   (`grep -rh 'uses:' .github/workflows/ | grep -v '@[0-9a-f]\{40\}'` mostra o que falta) —
#   e deixe a nota escrita AQUI, senão a próxima onda do kit a apaga. Fixar por SHA é bom
#   em qualquer casa (cadeia de suprimento) e não quebra nenhuma. `setup-node` pode SAIR em
#   vez de ser fixado: o script importa só `node:child_process` e `node:fs`, e uma asserção
#   de versão (`node -p process.versions.node`) resolve.
#
#   VACINA `V-PORTA-QUE-NAO-ABRE-NAO-APARECE`: gate que mede se a porta EXISTE e se alguém
#   a INVOCA não mede se ela ABRE. As três coisas são diferentes, e o portfólio já errou nas
#   três camadas, uma por vez.
#   VACINA `V-CAUSA-POR-CONTRASTE-DE-UM-CASO-SO`: o vizinho que passa dá hipótese, não causa.
#   Antes de escrever "a causa é X", procure a casa que tem X e NÃO tem o sintoma.
# A REGRA DURA DA SAÍDA
#   O log mostra `caminho:linha` + a CATEGORIA. NUNCA o valor — nem mascarado,
#   nem o trecho da linha. Log de Action é lido por qualquer um com acesso ao
#   repositório, e segredo pela metade ainda é pista.
#
# O QUE PASSA DE PROPÓSITO (D206)
#   A chave `publishable` do Supabase e o crachá JWT de papel `anon`: públicos
#   por desenho, vão embutidos no navegador de quem visita. Quem protege o dado
#   ali é o RLS. Barrá-los seria gritar lobo — e quem grita lobo não é ouvido.
#
# ANTES DE MEXER EM QUALQUER SEGREDO QUE ESTA PORTA ACUSAR
#   A lista de QUEM QUEBRA vai junto (regra `segredo-e-consumidor`, 25/08):
#   pedido de rotacionar/revogar/apagar SEM a lista de consumidores é pedido
#   INVÁLIDO e volta para a casa. A lista mora em
#   `portfolio-automacoes/SEGREDOS-E-CONSUMIDORES.md` e se MEDE, não se escreve
#   de cabeça.
# ════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: ['**']
  pull_request: {}
  workflow_dispatch: {}

# Mínimo possível: este job só faz checkout e lê arquivo. Zero escrita.
permissions:
  contents: read

jobs:
  varredura-de-segredos:
    # TETO DE TEMPO (A-595, 09/09). Sem esta linha o robô roda até o corte de 6 HORAS do
    # GitHub, e o GitHub cobra por minuto pendurado — foi assim que um navegador travado
    # comeu ~US$ 200 numa semana. O conserto de 08/09 pôs teto em 109 robôs JÁ EXISTENTES
    # e esqueceu o MOLDE: toda casa que instalasse o kit depois nascia sem teto de novo.
    # Consertar cópia sem consertar molde é consertar pelo tempo que a próxima cópia leva.
    timeout-minutes: 15
    name: Varredura de segredos (D200)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório com o histórico inteiro
        uses: actions/checkout@v4
        with:
          # A porta compara o que ESTE envio acrescentou com o que já existia.
          # Para isso precisa do histórico, não só do topo.
          fetch-depth: 0

      - name: Preparar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Segredo NOVO neste envio (a porta — reprova)
        # Só as linhas ACRESCENTADAS. O passivo antigo não entra aqui: senão a
        # porta reprovaria para sempre por causa de coisa que só o dono resolve,
        # e porta que reprova todo dia é porta que alguém desliga.
        # Branch nova / envio forçado manda 40 zeros — o próprio script trata.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TOPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/varredura-de-segredos.mjs --intervalo "${BASE}..${TOPO}"

      - name: Segredo VIVO na árvore inteira (só relatório, NÃO reprova)
        # ⚠️ AQUI ESTÁ A ÚNICA DIFERENÇA PARA A VERSÃO DO ESCRITÓRIO.
        #   Nasce em MODO AVISO de propósito. A casa quase sempre tem segredo
        #   antigo já versionado esperando o dono; travar por causa dele
        #   empurraria todo mundo para o `--no-verify` — e um porteiro
        #   desligado protege menos que porteiro nenhum, porque dá a sensação
        #   de estar protegido. Ele existe para que o passivo APAREÇA em toda
        #   execução, em vez de sumir do radar por já ser "coisa antiga".
        #
        # COMO TORNAR BLOQUEANTE: apague a linha `continue-on-error: true`
        #   abaixo. FAÇA ISSO QUANDO AS DUAS condições valerem:
        #     (a) `node scripts/varredura-de-segredos.mjs --arvore` devolver
        #         ZERO — ou seja, o dono já virou os valores em ponteiro (D208); e
        #     (b) o passo tiver passado ~2 semanas em modo aviso sem nenhum
        #         falso positivo (confira nos avisos das execuções).
        #   O escritório já cumpriu as duas e lá o passo é bloqueante.
        if: always()
        continue-on-error: true
        run: node scripts/varredura-de-segredos.mjs --arvore
